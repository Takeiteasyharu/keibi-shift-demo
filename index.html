<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>警備員勤務希望管理システム | テイシン警備 国分寺支社</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #111827;
      --muted: #4b5563;
      --line: #cbd5e1;
      --panel: #f8fafc;
      --brand: #14532d;
      --brand-2: #0f766e;
      --accent: #b91c1c;
      --blue: #1d4ed8;
      --purple: #6d28d9;
      --yellow: #854d0e;
      --green-bg: #dcfce7;
      --purple-bg: #ede9fe;
      --yellow-bg: #fef3c7;
      --gray-bg: #e5e7eb;
      --blue-bg: #dbeafe;
      --red-bg: #fee2e2;
      --focus: #f59e0b;
      font-family: "Yu Gothic", "Meiryo", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-size: 18px;
      line-height: 1.65;
    }

    button, input, select, textarea {
      font: inherit;
    }

    button, .button-link {
      min-height: 56px;
      border: 2px solid transparent;
      border-radius: 8px;
      padding: 12px 18px;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      background: var(--brand);
      color: #fff;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      touch-action: manipulation;
    }

    button.secondary { background: #fff; color: var(--brand); border-color: var(--brand); }
    button.warning { background: var(--accent); }
    button.neutral { background: #374151; }
    button:disabled { background: #9ca3af; color: #111827; cursor: not-allowed; border-color: #6b7280; }

    a { color: #0645ad; font-weight: 700; }

    input, select, textarea {
      width: 100%;
      min-height: 54px;
      border: 2px solid #64748b;
      border-radius: 8px;
      padding: 10px 12px;
      background: #fff;
      color: var(--text);
      font-size: 18px;
    }

    textarea { min-height: 110px; resize: vertical; }
    label { display: block; font-weight: 700; margin-bottom: 6px; }
    :focus-visible { outline: 4px solid var(--focus); outline-offset: 3px; }

    .app {
      width: min(1120px, 100%);
      margin: 0 auto;
      padding: 18px;
    }

    .screen { display: none; }
    .screen.active { display: block; }

    .top-title {
      margin: 14px 0 18px;
      font-size: clamp(30px, 7vw, 48px);
      line-height: 1.2;
      color: var(--brand);
      letter-spacing: 0;
    }

    .sub-title {
      margin: 0 0 20px;
      font-size: 22px;
      color: var(--muted);
      font-weight: 700;
    }

    .panel {
      border: 2px solid var(--line);
      border-radius: 8px;
      padding: 18px;
      background: var(--panel);
      margin-bottom: 18px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .full { grid-column: 1 / -1; }

    .actions {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .message {
      display: none;
      margin: 16px 0;
      padding: 14px 16px;
      border-radius: 8px;
      border: 2px solid #14532d;
      background: #ecfdf5;
      color: #064e3b;
      font-size: 20px;
      font-weight: 800;
    }

    .message.show { display: block; }
    .message.error { border-color: #b91c1c; background: #fff1f2; color: #991b1b; }

    .demo-info {
      display: grid;
      gap: 10px;
      font-size: 18px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      border-bottom: 3px solid var(--brand);
      padding-bottom: 14px;
      margin-bottom: 18px;
    }

    .header h1 {
      margin: 0;
      font-size: clamp(28px, 6vw, 42px);
      color: var(--brand);
      line-height: 1.2;
    }

    .user-line { font-weight: 800; color: var(--text); }

    .month-bar {
      display: grid;
      grid-template-columns: auto 1fr auto auto;
      gap: 10px;
      align-items: center;
      margin-bottom: 14px;
    }

    .month-label {
      text-align: center;
      font-size: 28px;
      font-weight: 900;
    }

    .calendar {
      border: 2px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
    }

    .weekdays, .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
    }

    .weekday {
      padding: 10px 6px;
      text-align: center;
      font-weight: 900;
      background: #f1f5f9;
      border-right: 1px solid var(--line);
      border-bottom: 2px solid var(--line);
    }

    .weekday:last-child { border-right: 0; }

    .day-cell {
      min-height: 138px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      padding: 8px;
      background: #fff;
    }

    .day-cell:nth-child(7n) { border-right: 0; }
    .day-cell.blank { background: #f8fafc; }

    .day-button {
      width: 100%;
      height: 100%;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      gap: 5px;
      border: 2px solid transparent;
      background: #fff;
      color: var(--text);
      padding: 8px;
      border-radius: 6px;
      text-align: left;
      font-size: 18px;
    }

    .day-button:hover { border-color: var(--brand-2); }
    .date-num { font-size: 24px; font-weight: 900; }
    .sunday, .holiday { color: #b91c1c; }
    .saturday { color: #1d4ed8; }
    .past .date-num { color: #6b7280; }

    .status-chip {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 900;
      font-size: 16px;
      color: #111827;
      border: 1px solid rgba(0,0,0,.18);
    }

    .status-none { background: #fff; }
    .status-day { background: var(--green-bg); }
    .status-night { background: var(--purple-bg); }
    .status-both { background: linear-gradient(180deg, var(--green-bg) 0 50%, var(--purple-bg) 50%); }
    .status-unavailable { background: var(--red-bg); }
    .status-undecided { background: var(--blue-bg); }
    .status-locked { background: var(--gray-bg); }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 16px 0;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(17, 24, 39, .72);
      z-index: 20;
      padding: 16px;
    }

    .modal-backdrop.show { display: flex; }

    .modal {
      width: min(720px, 100%);
      max-height: 92vh;
      overflow: auto;
      background: #fff;
      border-radius: 8px;
      padding: 20px;
      border: 3px solid var(--brand);
      box-shadow: 0 24px 80px rgba(0,0,0,.35);
    }

    .modal h2 {
      margin: 0 0 14px;
      font-size: 30px;
      line-height: 1.25;
    }

    .choice-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin: 14px 0;
    }

    .choice {
      min-height: 76px;
      background: #fff;
      color: var(--text);
      border: 3px solid #64748b;
      justify-content: flex-start;
      text-align: left;
    }

    .choice[aria-pressed="true"] {
      border-color: #111827;
      box-shadow: inset 0 0 0 4px rgba(20, 83, 45, .2);
    }

    .choice.day { background: var(--green-bg); }
    .choice.night { background: var(--purple-bg); }
    .choice.unavailable { background: var(--red-bg); }
    .choice.undecided { background: var(--blue-bg); }

    .lock-note {
      padding: 12px;
      background: #fef3c7;
      border: 2px solid #b45309;
      border-radius: 8px;
      font-weight: 800;
      margin: 12px 0;
    }

    .admin-tools {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      align-items: end;
    }

    .filter-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 14px 0;
    }

    .filter-buttons button {
      background: #fff;
      color: var(--text);
      border-color: #64748b;
    }

    .filter-buttons button.active {
      background: var(--brand);
      color: #fff;
      border-color: var(--brand);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      font-size: 18px;
    }

    th, td {
      border: 1px solid var(--line);
      padding: 10px;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #f1f5f9;
      font-weight: 900;
    }

    .admin-cards { display: none; }
    .small-text { font-size: 16px; color: var(--muted); font-weight: 700; }
    .bold { font-weight: 900; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      width: min(560px, calc(100% - 28px));
      display: none;
      padding: 14px 18px;
      border: 3px solid var(--brand);
      border-radius: 8px;
      background: #ecfdf5;
      color: #064e3b;
      font-size: 22px;
      font-weight: 900;
      text-align: center;
      z-index: 30;
    }

    .toast.show { display: block; }

    @media (max-width: 760px) {
      .app { padding: 12px; }
      .form-grid, .admin-tools, .choice-grid { grid-template-columns: 1fr; }
      .header { display: block; }
      .header .actions { margin-top: 12px; }
      .month-bar { grid-template-columns: 1fr; }
      .month-label { text-align: left; }
      .weekdays { display: none; }
      .calendar-grid { grid-template-columns: 1fr; gap: 10px; padding: 10px; background: #f8fafc; }
      .day-cell {
        min-height: 0;
        border: 2px solid var(--line);
        border-radius: 8px;
        padding: 0;
      }
      .day-cell.blank { display: none; }
      .day-button { min-height: 96px; }
      .calendar { border: 0; background: transparent; }
      .desktop-table { display: none; }
      .admin-cards { display: grid; gap: 12px; }
      .admin-card {
        border: 2px solid var(--line);
        border-radius: 8px;
        padding: 14px;
        background: #fff;
      }
      button, .button-link { width: 100%; }
      .actions, .filter-buttons { flex-direction: column; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section id="loginScreen" class="screen active" aria-labelledby="loginTitle">
      <h1 id="loginTitle" class="top-title">勤務希望管理システム</h1>
      <p class="sub-title">テイシン警備 国分寺支社</p>
      <div id="loginMessage" class="message" role="alert"></div>

      <div class="panel">
        <div class="form-grid">
          <div>
            <label for="loginGuardId">警備員番号</label>
            <input id="loginGuardId" type="text" inputmode="numeric" autocomplete="username" maxlength="6" aria-describedby="loginHelp">
          </div>
          <div>
            <label for="loginPassword">パスワード</label>
            <input id="loginPassword" type="password" autocomplete="current-password">
          </div>
        </div>
        <p id="loginHelp" class="small-text">警備員番号は6桁です。先頭の0も入力してください。</p>
        <div class="actions">
          <button id="loginButton" type="button">ログインする</button>
          <button id="showRegisterButton" class="secondary" type="button">初めて利用する方はこちら</button>
          <button id="adminDemoButton" class="neutral" type="button">内勤者デモ画面を開く</button>
        </div>
      </div>

      <div class="panel demo-info" aria-label="デモ用ログイン情報">
        <div class="bold">デモ用ログイン情報</div>
        <div>警備員デモ：警備員番号 <span class="bold">016939</span> / パスワード <span class="bold">123456</span></div>
        <div>内勤者デモ：警備員番号 <span class="bold">000001</span> / パスワード <span class="bold">admin123</span></div>
      </div>
    </section>

    <section id="registerScreen" class="screen" aria-labelledby="registerTitle">
      <h1 id="registerTitle" class="top-title">新規会員登録</h1>
      <div id="registerMessage" class="message" role="alert"></div>
      <div class="panel">
        <div class="form-grid">
          <div>
            <label for="regGuardId">警備員番号</label>
            <input id="regGuardId" type="text" inputmode="numeric" maxlength="6">
          </div>
          <div>
            <label for="regName">氏名</label>
            <input id="regName" type="text" autocomplete="name">
          </div>
          <div>
            <label for="regEmail">メールアドレス</label>
            <input id="regEmail" type="email" autocomplete="email">
          </div>
          <div>
            <label for="regZip">郵便番号</label>
            <input id="regZip" type="text" inputmode="numeric" autocomplete="postal-code">
          </div>
          <div>
            <label for="regPref">都道府県</label>
            <input id="regPref" type="text" autocomplete="address-level1">
          </div>
          <div>
            <label for="regCity">市区町村</label>
            <input id="regCity" type="text" autocomplete="address-level2">
          </div>
          <div>
            <label for="regStreet">町名・番地</label>
            <input id="regStreet" type="text" autocomplete="address-line1">
          </div>
          <div>
            <label for="regBuilding">建物名・部屋番号</label>
            <input id="regBuilding" type="text" autocomplete="address-line2">
          </div>
          <div>
            <label for="regPassword">パスワード</label>
            <input id="regPassword" type="password" autocomplete="new-password">
          </div>
          <div>
            <label for="regPasswordConfirm">パスワード確認</label>
            <input id="regPasswordConfirm" type="password" autocomplete="new-password">
          </div>
        </div>
        <div class="actions">
          <button id="registerButton" type="button">登録する</button>
          <button id="backLoginButton" class="secondary" type="button">ログイン画面へ戻る</button>
        </div>
      </div>
    </section>

    <section id="calendarScreen" class="screen" aria-labelledby="calendarTitle">
      <div class="header">
        <div>
          <h1 id="calendarTitle">勤務希望</h1>
          <div class="user-line"><span id="currentUserName"></span> / 警備員番号 <span id="currentUserId"></span></div>
        </div>
        <div class="actions">
          <button id="logoutButton" class="secondary" type="button">ログアウト</button>
        </div>
      </div>

      <div class="month-bar">
        <button id="prevMonthButton" class="secondary" type="button">前の月</button>
        <div id="monthLabel" class="month-label" aria-live="polite"></div>
        <button id="nextMonthButton" class="secondary" type="button">次の月</button>
        <button id="todayButton" class="neutral" type="button">今日に戻る</button>
      </div>

      <div class="legend" aria-label="表示の説明">
        <span class="status-chip status-day">日勤</span>
        <span class="status-chip status-night">夜勤</span>
        <span class="status-chip status-both">日勤・夜勤</span>
        <span class="status-chip status-unavailable">不可</span>
        <span class="status-chip status-undecided">未定</span>
        <span class="status-chip status-locked">締切済み</span>
      </div>

      <div class="calendar" aria-label="勤務希望カレンダー">
        <div class="weekdays" aria-hidden="true">
          <div class="weekday sunday">日</div>
          <div class="weekday">月</div>
          <div class="weekday">火</div>
          <div class="weekday">水</div>
          <div class="weekday">木</div>
          <div class="weekday">金</div>
          <div class="weekday saturday">土</div>
        </div>
        <div id="calendarGrid" class="calendar-grid"></div>
      </div>
    </section>

    <section id="adminScreen" class="screen" aria-labelledby="adminTitle">
      <div class="header">
        <div>
          <h1 id="adminTitle">内勤者用管理画面</h1>
          <div id="adminDateLabel" class="user-line"></div>
        </div>
        <div class="actions">
          <button id="adminPrevDay" class="secondary" type="button">前の日</button>
          <button id="adminToday" class="neutral" type="button">今日</button>
          <button id="adminNextDay" class="secondary" type="button">次の日</button>
          <button id="adminLogout" class="secondary" type="button">ログアウト</button>
        </div>
      </div>

      <div class="panel">
        <div class="admin-tools">
          <div>
            <label for="adminDate">表示対象の日付</label>
            <input id="adminDate" type="date">
          </div>
          <div>
            <label for="adminSearch">検索</label>
            <input id="adminSearch" type="text" placeholder="番号・氏名・住所・備考">
          </div>
          <div>
            <button id="adminSearchButton" type="button">検索する</button>
          </div>
          <div>
            <button id="adminClearButton" class="secondary" type="button">条件を戻す</button>
          </div>
        </div>

        <div id="adminFilters" class="filter-buttons" aria-label="絞り込み">
          <button type="button" data-filter="all" class="active">すべて</button>
          <button type="button" data-filter="day">日勤希望者</button>
          <button type="button" data-filter="night">夜勤希望者</button>
          <button type="button" data-filter="both">日勤・夜勤どちらも可能</button>
          <button type="button" data-filter="unavailable">勤務不可</button>
          <button type="button" data-filter="undecided">未定</button>
          <button type="button" data-filter="none">未提出</button>
        </div>
      </div>

      <div class="desktop-table">
        <table>
          <thead>
            <tr>
              <th>警備員番号</th>
              <th>氏名</th>
              <th>日勤希望</th>
              <th>夜勤希望</th>
              <th>状況</th>
              <th>備考</th>
              <th>郵便番号</th>
              <th>住所</th>
              <th>メールアドレス</th>
            </tr>
          </thead>
          <tbody id="adminTableBody"></tbody>
        </table>
      </div>
      <div id="adminCards" class="admin-cards"></div>
    </section>
  </main>

  <div id="shiftModalBackdrop" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <h2 id="modalTitle"></h2>
      <div id="modalLockNote" class="lock-note" hidden></div>
      <div class="choice-grid">
        <button id="choiceDay" class="choice day" type="button" aria-pressed="false">日勤を希望する</button>
        <button id="choiceNight" class="choice night" type="button" aria-pressed="false">夜勤を希望する</button>
        <button id="choiceUnavailable" class="choice unavailable" type="button" aria-pressed="false">勤務できない</button>
        <button id="choiceUndecided" class="choice undecided" type="button" aria-pressed="false">まだ分からない</button>
      </div>
      <label for="shiftNote">備考</label>
      <textarea id="shiftNote" placeholder="例：国分寺駅周辺を希望、午後8時以降なら勤務可能、この日は遠方勤務不可"></textarea>
      <div class="actions">
        <button id="saveShiftButton" type="button">保存する</button>
        <button id="closeShiftButton" class="secondary" type="button">変更せず閉じる</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

      },
      "012345": {
        "2026-07-21": { day: false, night: true, unavailable: false, undecided: false, note: "夜勤のみ希望" },
        "2026-07-24": { day: false, night: false, unavailable: false, undecided: true, note: "予定確認中" }
      },
      "023456": {
        "2026-07-21": { day: true, night: true, unavailable: false, undecided: false, note: "遠方は不可" },
        "2026-07-25": { day: true, night: false, unavailable: false, undecided: false, note: "午前集合可能" }
      },
      "034567": {
        "2026-07-21": { day: false, night: false, unavailable: true, undecided: false, note: "家族予定あり" },
        "2026-07-26": { day: false, night: true, unavailable: false, undecided: false, note: "午後8時以降なら可能" }
      },
      "045678": {
        "2026-07-22": { day: true, night: false, unavailable: false, undecided: false, note: "立川方面希望" }
      }
    };

    const HOLIDAYS_2026 = {
      "2026-01-01": "元日", "2026-01-12": "成人の日", "2026-02-11": "建国記念の日",
      "2026-02-23": "天皇誕生日", "2026-03-20": "春分の日", "2026-04-29": "昭和の日",
      "2026-05-03": "憲法記念日", "2026-05-04": "みどりの日", "2026-05-05": "こどもの日",
      "2026-05-06": "振替休日", "2026-07-20": "海の日", "2026-08-11": "山の日",
      "2026-09-21": "敬老の日", "2026-09-22": "国民の休日", "2026-09-23": "秋分の日",
      "2026-10-12": "スポーツの日", "2026-11-03": "文化の日", "2026-11-23": "勤労感謝の日"
    };

    const state = {
      currentUser: null,
      viewDate: new Date(),
      selectedDateKey: "",
      draft: { day: false, night: false, unavailable: false, undecided: false, note: "" },
      adminDate: toDateKey(new Date()),
      adminFilter: "all",
      adminSearch: ""
    };

    const el = {};

    document.addEventListener("DOMContentLoaded", () => {
      cacheElements();
      ensureSeedData();
      bindEvents();
      restoreSession();
    });

    function cacheElements() {
      [
        "loginScreen", "registerScreen", "calendarScreen", "adminScreen", "loginMessage", "registerMessage",
        "loginGuardId", "loginPassword", "loginButton", "showRegisterButton", "adminDemoButton",
        "regGuardId", "regName", "regEmail", "regZip", "regPref", "regCity", "regStreet", "regBuilding",
        "regPassword", "regPasswordConfirm", "registerButton", "backLoginButton", "currentUserName",
        "currentUserId", "logoutButton", "prevMonthButton", "nextMonthButton", "todayButton", "monthLabel",
        "calendarGrid", "shiftModalBackdrop", "modalTitle", "modalLockNote", "choiceDay", "choiceNight",
        "choiceUnavailable", "choiceUndecided", "shiftNote", "saveShiftButton", "closeShiftButton",
        "toast", "adminDateLabel", "adminPrevDay", "adminToday", "adminNextDay", "adminLogout",
        "adminDate", "adminSearch", "adminSearchButton", "adminClearButton", "adminFilters",
        "adminTableBody", "adminCards"
      ].forEach(id => { el[id] = document.getElementById(id); });
    }

    function bindEvents() {
      el.loginButton.addEventListener("click", login);
      el.loginPassword.addEventListener("keydown", event => { if (event.key === "Enter") login(); });
      el.showRegisterButton.addEventListener("click", () => showScreen("register"));
      el.backLoginButton.addEventListener("click", () => showScreen("login"));
      el.adminDemoButton.addEventListener("click", () => startSession(getUserById("000001")));
      el.registerButton.addEventListener("click", registerUser);
      el.logoutButton.addEventListener("click", logout);
      el.adminLogout.addEventListener("click", logout);
      el.prevMonthButton.addEventListener("click", () => moveMonth(-1));
      el.nextMonthButton.addEventListener("click", () => moveMonth(1));
      el.todayButton.addEventListener("click", () => { state.viewDate = new Date(); renderCalendar(); });
      el.closeShiftButton.addEventListener("click", closeShiftModal);
      el.shiftModalBackdrop.addEventListener("click", event => {
        if (event.target === el.shiftModalBackdrop) closeShiftModal();
      });
      el.saveShiftButton.addEventListener("click", saveShift);
      el.choiceDay.addEventListener("click", () => toggleDraft("day"));
      el.choiceNight.addEventListener("click", () => toggleDraft("night"));
      el.choiceUnavailable.addEventListener("click", () => toggleDraft("unavailable"));
      el.choiceUndecided.addEventListener("click", () => toggleDraft("undecided"));
      el.adminPrevDay.addEventListener("click", () => moveAdminDate(-1));
      el.adminNextDay.addEventListener("click", () => moveAdminDate(1));
      el.adminToday.addEventListener("click", () => setAdminDate(toDateKey(new Date())));
      el.adminDate.addEventListener("change", () => setAdminDate(el.adminDate.value));
      el.adminSearchButton.addEventListener("click", () => { state.adminSearch = el.adminSearch.value.trim(); renderAdmin(); });
      el.adminSearch.addEventListener("keydown", event => { if (event.key === "Enter") { state.adminSearch = el.adminSearch.value.trim(); renderAdmin(); } });
      el.adminClearButton.addEventListener("click", clearAdminConditions);
      el.adminFilters.addEventListener("click", event => {
        const button = event.target.closest("button[data-filter]");
        if (!button) return;
        state.adminFilter = button.dataset.filter;
        renderAdmin();
      });
      document.addEventListener("keydown", event => {
        if (event.key === "Escape" && el.shiftModalBackdrop.classList.contains("show")) closeShiftModal();
      });
    }

    function ensureSeedData() {
      const savedUsers = safeRead(STORAGE_KEYS.users, null);
      if (!Array.isArray(savedUsers)) {
        localStorage.setItem(STORAGE_KEYS.users, JSON.stringify(DEMO_USERS));
      } else {
        const merged = [...savedUsers];
        DEMO_USERS.forEach(user => {
          if (!merged.some(item => item.id === user.id)) merged.push(user);
        });
        localStorage.setItem(STORAGE_KEYS.users, JSON.stringify(merged));
      }

      const savedShifts = safeRead(STORAGE_KEYS.shifts, null);
      if (!savedShifts || typeof savedShifts !== "object" || Array.isArray(savedShifts)) {
        localStorage.setItem(STORAGE_KEYS.shifts, JSON.stringify(SAMPLE_SHIFTS));
      }
    }

    function restoreSession() {
      const session = safeRead(STORAGE_KEYS.session, null);
      if (session && session.userId) {
        const user = getUserById(session.userId);
        if (user) {
          startSession(user, false);
          return;
        }
      }
      showScreen("login");
    }

    function login() {
      const id = el.loginGuardId.value.trim();
      const password = el.loginPassword.value;
      const user = getUserById(id);
      if (!/^\d{6}$/.test(id)) {
        showMessage(el.loginMessage, "警備員番号は6桁で入力してください", true);
        return;
      }
      if (!user || user.password !== password) {
        showMessage(el.loginMessage, "警備員番号またはパスワードが正しくありません", true);
        return;
      }
      startSession(user);
    }

    function startSession(user, announce = true) {
      state.currentUser = user;
      localStorage.setItem(STORAGE_KEYS.session, JSON.stringify({ userId: user.id, role: user.role, savedAt: new Date().toISOString() }));
      if (user.role === "admin") {
        state.adminDate = toDateKey(new Date());
        showScreen("admin");
        renderAdmin();
      } else {
        state.viewDate = new Date();
        showScreen("calendar");
        renderUserHeader();
        renderCalendar();
      }
      if (announce) showToast("ログインしました");
    }

    function logout() {
      localStorage.removeItem(STORAGE_KEYS.session);
      state.currentUser = null;
      el.loginPassword.value = "";
      showScreen("login");
      showToast("ログアウトしました");
    }

    function registerUser() {
      clearMessage(el.registerMessage);
      const user = {
        id: el.regGuardId.value.trim(),
        name: el.regName.value.trim(),
        email: el.regEmail.value.trim(),
        zip: el.regZip.value.trim(),
        pref: el.regPref.value.trim(),
        city: el.regCity.value.trim(),
        street: el.regStreet.value.trim(),
        building: el.regBuilding.value.trim(),
        password: el.regPassword.value,
        role: "guard"
      };
      const errors = validateRegistration(user, el.regPasswordConfirm.value);
      if (errors.length) {
        showMessage(el.registerMessage, errors.join(" / "), true);
        return;
      }
      const users = getUsers();
      users.push(user);
      localStorage.setItem(STORAGE_KEYS.users, JSON.stringify(users));
      showMessage(el.registerMessage, "登録が完了しました", false);
      startSession(user, false);
      showToast("登録が完了しました");
    }

    function validateRegistration(user, confirmPassword) {
      const errors = [];
      if (!/^\d{6}$/.test(user.id)) errors.push("警備員番号は6桁で入力してください");
      if (!user.name) errors.push("氏名を入力してください");
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(user.email)) errors.push("メールアドレスの形式が正しくありません");
      if (!user.zip) errors.push("郵便番号を入力してください");
      if (!user.pref || !user.city || !user.street) errors.push("住所を入力してください");
      if (!user.password) errors.push("パスワードを入力してください");
      if (user.password !== confirmPassword) errors.push("パスワードが一致していません");
      if (getUserById(user.id)) errors.push("この警備員番号はすでに登録されています");
      return errors;
    }

    function renderUserHeader() {
      el.currentUserName.textContent = state.currentUser.name;
      el.currentUserId.textContent = state.currentUser.id;
    }

    function renderCalendar() {
      const year = state.viewDate.getFullYear();
      const month = state.viewDate.getMonth();
      el.monthLabel.textContent = `${year}年${month + 1}月`;
      el.calendarGrid.innerHTML = "";

      const first = new Date(year, month, 1);
      const last = new Date(year, month + 1, 0);
      for (let i = 0; i < first.getDay(); i++) {
        const blank = document.createElement("div");
        blank.className = "day-cell blank";
        el.calendarGrid.appendChild(blank);
      }

      for (let day = 1; day <= last.getDate(); day++) {
        const date = new Date(year, month, day);
        const dateKey = toDateKey(date);
        const cell = document.createElement("div");
        const dayOfWeek = date.getDay();
        const isHoliday = Boolean(HOLIDAYS_2026[dateKey]);
        cell.className = `day-cell ${isPastDate(dateKey) ? "past" : ""}`;

        const button = document.createElement("button");
        button.type = "button";
        button.className = "day-button";
        button.setAttribute("aria-label", `${formatDateLong(dateKey)}の勤務希望を開く`);
        button.addEventListener("click", () => openShiftModal(dateKey));

        const dateNum = document.createElement("span");
        dateNum.className = `date-num ${dayOfWeek === 0 ? "sunday" : ""} ${dayOfWeek === 6 ? "saturday" : ""} ${isHoliday ? "holiday" : ""}`;
        dateNum.textContent = `${day}日 ${weekdayName(dayOfWeek)}`;
        button.appendChild(dateNum);

        if (isHoliday) {
          const holiday = document.createElement("span");
          holiday.className = "small-text holiday";
          holiday.textContent = HOLIDAYS_2026[dateKey];
          button.appendChild(holiday);
        }

        const shift = getShift(state.currentUser.id, dateKey);
        const status = getStatus(shift);
        const chip = document.createElement("span");
        chip.className = `status-chip ${status.className}`;
        chip.textContent = status.label;
        button.appendChild(chip);

        const lock = getLockState(dateKey);
        if (lock.dayLocked || lock.nightLocked || isPastDate(dateKey)) {
          const locked = document.createElement("span");
          locked.className = "status-chip status-locked";
          locked.textContent = lockMessageShort(lock, dateKey);
          button.appendChild(locked);
        }

        cell.appendChild(button);
        el.calendarGrid.appendChild(cell);
      }
    }

    function openShiftModal(dateKey) {
      state.selectedDateKey = dateKey;
      const existing = getShift(state.currentUser.id, dateKey);
      state.draft = normalizeShift(existing);
      el.shiftNote.value = state.draft.note || "";
      el.modalTitle.textContent = `${formatDateLong(dateKey)}`;

      const lock = getLockState(dateKey);
      const past = isPastDate(dateKey);
      const lockText = lockMessageFull(lock, dateKey);
      if (past || lockText) {
        el.modalLockNote.hidden = false;
        el.modalLockNote.textContent = past ? "過去の日付は確認のみです。内容の変更はできません。" : lockText;
      } else {
        el.modalLockNote.hidden = true;
        el.modalLockNote.textContent = "";
      }

      updateChoiceButtons();
      const fullyLocked = past || (lock.dayLocked && lock.nightLocked);
      const wholeDayChoiceLocked = past || lock.dayLocked || lock.nightLocked;
      el.choiceDay.disabled = past || lock.dayLocked;
      el.choiceNight.disabled = past || lock.nightLocked;
      el.choiceUnavailable.disabled = wholeDayChoiceLocked;
      el.choiceUndecided.disabled = wholeDayChoiceLocked;
      el.shiftNote.disabled = past;
      el.saveShiftButton.disabled = past || fullyLocked;
      el.shiftModalBackdrop.classList.add("show");
      el.choiceDay.focus();
    }

    function closeShiftModal() {
      el.shiftModalBackdrop.classList.remove("show");
    }

    function toggleDraft(kind) {
      const lock = getLockState(state.selectedDateKey);
      if (kind === "day" && lock.dayLocked) return;
      if (kind === "night" && lock.nightLocked) return;

      if (kind === "unavailable" || kind === "undecided") {
        state.draft.unavailable = kind === "unavailable" ? !state.draft.unavailable : false;
        state.draft.undecided = kind === "undecided" ? !state.draft.undecided : false;
        if (state.draft.unavailable || state.draft.undecided) {
          state.draft.day = false;
          state.draft.night = false;
        }
      } else {
        state.draft[kind] = !state.draft[kind];
        if (state.draft.day || state.draft.night) {
          state.draft.unavailable = false;
          state.draft.undecided = false;
        }
      }
      updateChoiceButtons();
    }

    function updateChoiceButtons() {
      el.choiceDay.setAttribute("aria-pressed", String(state.draft.day));
      el.choiceNight.setAttribute("aria-pressed", String(state.draft.night));
      el.choiceUnavailable.setAttribute("aria-pressed", String(state.draft.unavailable));
      el.choiceUndecided.setAttribute("aria-pressed", String(state.draft.undecided));
      const dayLock = getLockState(state.selectedDateKey);
      el.choiceDay.textContent = dayLock.dayLocked ? "日勤 締切済み" : "日勤を希望する";
      el.choiceNight.textContent = dayLock.nightLocked ? "夜勤 締切済み" : "夜勤を希望する";
    }

    function saveShift() {
      const dateKey = state.selectedDateKey;
      const lock = getLockState(dateKey);
      if (isPastDate(dateKey) || (lock.dayLocked && lock.nightLocked)) return;
      const existing = normalizeShift(getShift(state.currentUser.id, dateKey));
      const next = normalizeShift(state.draft);
      next.note = el.shiftNote.value.trim();
      if (lock.dayLocked) next.day = existing.day;
      if (lock.nightLocked) next.night = existing.night;
      if (next.unavailable || next.undecided) {
        next.day = false;
        next.night = false;
      }

      const shifts = getShifts();
      if (!shifts[state.currentUser.id]) shifts[state.currentUser.id] = {};
      shifts[state.currentUser.id][dateKey] = next;
      localStorage.setItem(STORAGE_KEYS.shifts, JSON.stringify(shifts));
      closeShiftModal();
      renderCalendar();
      showToast("保存しました");
    }

    function renderAdmin() {
      el.adminDate.value = state.adminDate;
      el.adminDateLabel.textContent = `${formatDateLong(state.adminDate)} の勤務希望`;
      Array.from(el.adminFilters.querySelectorAll("button")).forEach(button => {
        button.classList.toggle("active", button.dataset.filter === state.adminFilter);
      });

      const rows = buildAdminRows();
      el.adminTableBody.innerHTML = "";
      el.adminCards.innerHTML = "";

      rows.forEach(row => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${escapeHtml(row.id)}</td>
          <td>${escapeHtml(row.name)}</td>
          <td>${row.shift.day ? "希望あり" : "なし"}</td>
          <td>${row.shift.night ? "希望あり" : "なし"}</td>
          <td><span class="status-chip ${row.status.className}">${escapeHtml(row.status.label)}</span></td>
          <td>${escapeHtml(row.shift.note || "")}</td>
          <td>${escapeHtml(row.zip)}</td>
          <td>${escapeHtml(row.address)}</td>
          <td><a href="mailto:${encodeURIComponent(row.email)}">${escapeHtml(row.email)}</a></td>
        `;
        el.adminTableBody.appendChild(tr);

        const card = document.createElement("article");
        card.className = "admin-card";
        card.innerHTML = `
          <div class="bold">${escapeHtml(row.name)}</div>
          <div>警備員番号 ${escapeHtml(row.id)}</div>
          <div><span class="status-chip ${row.status.className}">${escapeHtml(row.status.label)}</span></div>
          <div>日勤：${row.shift.day ? "希望あり" : "なし"} / 夜勤：${row.shift.night ? "希望あり" : "なし"}</div>
          <div>備考：${escapeHtml(row.shift.note || "なし")}</div>
          <div>住所：${escapeHtml(row.address)}</div>
          <div>メール：<a href="mailto:${encodeURIComponent(row.email)}">${escapeHtml(row.email)}</a></div>
        `;
        el.adminCards.appendChild(card);
      });

      if (!rows.length) {
        el.adminTableBody.innerHTML = `<tr><td colspan="9">該当する警備員はいません</td></tr>`;
        el.adminCards.innerHTML = `<div class="panel bold">該当する警備員はいません</div>`;
      }
    }

    function buildAdminRows() {
      const query = state.adminSearch.toLowerCase();
      return getUsers()
        .filter(user => user.role !== "admin")
        .map(user => {
          const shift = normalizeShift(getShift(user.id, state.adminDate));
          const status = getStatus(shift);
          const address = `${user.pref}${user.city}${user.street}${user.building ? " " + user.building : ""}`;
          return { ...user, shift, status, address };
        })
        .filter(row => matchesFilter(row))
        .filter(row => {
          if (!query) return true;
          return [row.id, row.name, row.address, row.shift.note].join(" ").toLowerCase().includes(query);
        });
    }

    function matchesFilter(row) {
      const shift = row.shift;
      switch (state.adminFilter) {
        case "day": return shift.day && !shift.night;
        case "night": return shift.night && !shift.day;
        case "both": return shift.day && shift.night;
        case "unavailable": return shift.unavailable;
        case "undecided": return shift.undecided;
        case "none": return !shift.day && !shift.night && !shift.unavailable && !shift.undecided && !shift.note;
        default: return true;
      }
    }

    function clearAdminConditions() {
      state.adminFilter = "all";
      state.adminSearch = "";
      el.adminSearch.value = "";
      renderAdmin();
    }

    function moveMonth(amount) {
      state.viewDate = new Date(state.viewDate.getFullYear(), state.viewDate.getMonth() + amount, 1);
      renderCalendar();
    }

    function moveAdminDate(amount) {
      const date = parseDateKey(state.adminDate);
      date.setDate(date.getDate() + amount);
      setAdminDate(toDateKey(date));
    }

    function setAdminDate(dateKey) {
      if (!dateKey) return;
      state.adminDate = dateKey;
      renderAdmin();
    }

    function showScreen(name) {
      const map = {
        login: el.loginScreen,
        register: el.registerScreen,
        calendar: el.calendarScreen,
        admin: el.adminScreen
      };
      Object.values(map).forEach(screen => screen.classList.remove("active"));
      map[name].classList.add("active");
      window.scrollTo({ top: 0, behavior: "instant" });
    }

    function getUsers() {
      const users = safeRead(STORAGE_KEYS.users, []);
      return Array.isArray(users) ? users.filter(user => user && /^\d{6}$/.test(user.id || "")) : [];
    }

    function getUserById(id) {
      return getUsers().find(user => user.id === id);
    }

    function getShifts() {
      const shifts = safeRead(STORAGE_KEYS.shifts, {});
      return shifts && typeof shifts === "object" && !Array.isArray(shifts) ? shifts : {};
    }

    function getShift(userId, dateKey) {
      const shifts = getShifts();
      return shifts[userId] && shifts[userId][dateKey] ? shifts[userId][dateKey] : null;
    }

    function normalizeShift(shift) {
      return {
        day: Boolean(shift && shift.day),
        night: Boolean(shift && shift.night),
        unavailable: Boolean(shift && shift.unavailable),
        undecided: Boolean(shift && shift.undecided),
        note: shift && typeof shift.note === "string" ? shift.note : ""
      };
    }

    function getStatus(shift) {
      const item = normalizeShift(shift);
      if (item.day && item.night) return { label: "日勤・夜勤", className: "status-both" };
      if (item.day) return { label: "日勤", className: "status-day" };
      if (item.night) return { label: "夜勤", className: "status-night" };
      if (item.unavailable) return { label: "不可", className: "status-unavailable" };
      if (item.undecided) return { label: "未定", className: "status-undecided" };
      return { label: "未入力", className: "status-none" };
    }

    function getLockState(dateKey) {
      const workDate = parseDateKey(dateKey);
      const dayLock = new Date(workDate.getFullYear(), workDate.getMonth(), workDate.getDate() - 1, 0, 0, 0);
      const nightLock = new Date(workDate.getFullYear(), workDate.getMonth(), workDate.getDate() - 1, 12, 0, 0);
      const now = new Date();
      return { dayLocked: now >= dayLock, nightLocked: now >= nightLock };
    }

    function lockMessageShort(lock, dateKey) {
      if (isPastDate(dateKey)) return "確認のみ";
      if (lock.dayLocked && lock.nightLocked) return "締切済み";
      if (lock.dayLocked) return "日勤締切";
      if (lock.nightLocked) return "夜勤締切";
      return "";
    }

    function lockMessageFull(lock) {
      if (lock.dayLocked && lock.nightLocked) return "日勤と夜勤の受付は締め切られました。登録済み内容は確認できます。";
      if (lock.dayLocked) return "日勤の受付は締め切られました。夜勤はまだ変更できます。";
      if (lock.nightLocked) return "夜勤の受付は締め切られました。日勤はまだ変更できます。";
      return "";
    }

    function isPastDate(dateKey) {
      return dateKey < toDateKey(new Date());
    }

    function toDateKey(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function parseDateKey(dateKey) {
      const [year, month, day] = dateKey.split("-").map(Number);
      return new Date(year, month - 1, day);
    }

    function formatDateLong(dateKey) {
      const date = parseDateKey(dateKey);
      const holiday = HOLIDAYS_2026[dateKey] ? `・${HOLIDAYS_2026[dateKey]}` : "";
      return `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日 ${weekdayName(date.getDay())}曜日${holiday}`;
    }

    function weekdayName(index) {
      return ["日", "月", "火", "水", "木", "金", "土"][index];
    }

    function showMessage(target, text, isError) {
      target.textContent = text;
      target.classList.toggle("error", Boolean(isError));
      target.classList.add("show");
    }

    function clearMessage(target) {
      target.textContent = "";
      target.classList.remove("show", "error");
    }

    function showToast(text) {
      el.toast.textContent = text;
      el.toast.classList.add("show");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => el.toast.classList.remove("show"), 2600);
    }

    function safeRead(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        if (!raw) return fallback;
        return JSON.parse(raw);
      } catch (error) {
        console.warn("保存データを読み込めませんでした", key, error);
        return fallback;
      }
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
</body>
</html>
